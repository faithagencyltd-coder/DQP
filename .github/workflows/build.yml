name: DQP — tests et installateur Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  windows-installer:
    needs: checks
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: DQP-Setup-windows
          path: release/DQP-Setup-*.exe
          if-no-files-found: error
      # Sur la branche main : si la version de package.json n'est pas encore publiée,
      # GitHub crée l'étiquette vX.Y.Z et la version dans « Releases » (téléchargement direct).
      - name: Publier la version
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="v$(node -p "require('./package.json').version")"
          if gh release view "$V" >/dev/null 2>&1; then
            echo "La version $V est déjà publiée."
            exit 0
          fi
          gh release create "$V" release/DQP-Setup-*.exe --target "$GITHUB_SHA" \
            --title "DQP ${V#v}" \
            --notes "Installateur Windows de DQP ${V#v}. Non signé : Windows peut afficher « Windows a protégé votre ordinateur » ; cliquer sur Informations complémentaires, puis Exécuter quand même."
