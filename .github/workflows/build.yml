name: DQP — tests et installateur Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  windows-installer:
    needs: checks
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: DQP-Setup-windows
          path: release/DQP-Setup-*.exe
          if-no-files-found: error
      # Sur une étiquette v* : l'installateur est publié dans « Releases » (téléchargement direct).
      - name: Publier la version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release/DQP-Setup-*.exe \
            --title "DQP ${GITHUB_REF_NAME#v}" \
            --notes "Installateur Windows de DQP ${GITHUB_REF_NAME#v} (non signé : Windows peut afficher « Éditeur inconnu », cliquer sur Informations complémentaires puis Exécuter quand même)."
